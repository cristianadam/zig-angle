name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Developed against 0.17.0-dev.2163+89ff10d56. Dev tarballs are pruned from
  # ziglang.org after a while, so pinning one makes the workflow rot; master is
  # the honest choice for a project that tracks a development compiler, at the
  # cost of upstream zig being able to break the build. 0.16.0 is not an option,
  # it access-violates on ARM64 Windows.
  ZIG_VERSION: master

jobs:
  # Everything except Apple. zig cross-compiles, so the Windows targets are
  # built on Linux as well; the runner architecture is matched to the target
  # wherever one exists, which keeps the sysroot native and lets the smoke test
  # actually run instead of being skipped for want of anything to run it on.
  cross:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: x86_64-linux-gnu,             os: ubuntu-24.04 }
          - { preset: x86_64-linux-musl,            os: ubuntu-24.04 }
          - { preset: aarch64-linux-gnu,            os: ubuntu-24.04-arm }
          - { preset: aarch64-linux-musl,           os: ubuntu-24.04-arm }
          - { preset: x86_64-windows-gnu,           os: ubuntu-24.04 }
          - { preset: aarch64-windows-gnu,          os: ubuntu-24.04 }
          - { preset: x86-windows-gnu,              os: ubuntu-24.04 }
          - { preset: x86_64-linux-gnu-vulkan,      os: ubuntu-24.04 }
          - { preset: aarch64-linux-gnu-vulkan,     os: ubuntu-24.04-arm }
          - { preset: x86_64-windows-gnu-vulkan,    os: ubuntu-24.04 }
          - { preset: aarch64-windows-gnu-vulkan,   os: ubuntu-24.04 }
          - { preset: x86_64-linux-gnu-vulkan-x11,  os: ubuntu-24.04 }
          - { preset: aarch64-linux-gnu-vulkan-x11, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          # Not recursive. ANGLE has 79 submodules of its own - the gclient
          # DEPS mirrored as gitlinks - and third_party/gles1_conform is on
          # chrome-internal.googlesource.com, which no public runner can read.
          # prepare-angle.sh fetches the five that are actually needed.
          submodules: true

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build llvm python3-ply
          echo "ANGLE_LLVM_TOOLS_DIR=$(llvm-config --bindir)" >> "$GITHUB_ENV"

      - name: Prepare the ANGLE checkout
        run: bash tools/prepare-angle.sh

      # The x11 presets need xcb and friends for the target, which zig does not
      # bundle. The runner architecture matches the target, so this takes the
      # script's native path with no cross-architecture URL rewriting, and it
      # needs no root - which is what lets it work on a hosted runner at all.
      - name: Build the target sysroot
        if: endsWith(matrix.preset, '-x11')
        run: |
          bash tools/make-linux-sysroot.sh "$RUNNER_TEMP/sysroot"
          echo "ZIG_SYSROOT=$RUNNER_TEMP/sysroot" >> "$GITHUB_ENV"
          echo "ZIG_GLIBC_VERSION=2.39" >> "$GITHUB_ENV"

      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: dist/${{ matrix.preset }}
          if-no-files-found: error

  # Apple targets need an Apple SDK, which cannot be redistributed - so build
  # them on a macOS runner, where Xcode's is already there. This is also the
  # only job whose host is neither Windows nor Linux, and the only one where
  # the Darwin install-name workaround correctly does nothing.
  macos:
    name: ${{ matrix.preset }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        preset:
          - aarch64-macos-none
          - x86_64-macos-none
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install build dependencies
        run: |
          brew install ninja llvm
          python3 -m pip install --break-system-packages ply
          # Xcode's SDK, rather than a copy carried around; the toolchain only
          # needs the root and attaches headers and frameworks itself.
          echo "ANGLE_MACOS_SDK=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          # Xcode ships nm, not llvm-nm, which is the name the export checks
          # look for; brew's llvm has it.
          echo "ANGLE_LLVM_TOOLS_DIR=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"

      - name: Prepare the ANGLE checkout
        run: bash tools/prepare-angle.sh

      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: dist/${{ matrix.preset }}
          if-no-files-found: error

  # The Windows binaries are built on Linux and nothing there can run them.
  # Take the artifacts and execute the smoke test on real Windows, on both
  # architectures.
  windows-run:
    name: run ${{ matrix.preset }}
    needs: cross
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: x86_64-windows-gnu,         os: windows-2022 }
          - { preset: x86_64-windows-gnu-vulkan,  os: windows-2022 }
          # x86 runs on an x64 runner under WoW64.
          - { preset: x86-windows-gnu,            os: windows-2022 }
          - { preset: aarch64-windows-gnu,        os: windows-11-arm }
          - { preset: aarch64-windows-gnu-vulkan, os: windows-11-arm }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: dist
      - name: Run the smoke test
        shell: cmd
        # 77 is the test's own "no usable backend here", which a runner with
        # no GPU is entitled to report; anything else non-zero is a failure.
        run: |
          cd dist\bin
          angle_smoke.exe
          set rc=%errorlevel%
          echo angle_smoke exited %rc%
          if "%rc%"=="0" exit /b 0
          if "%rc%"=="77" exit /b 0
          exit /b 1
